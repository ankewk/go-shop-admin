version: '3.8'

services:
  # Angular前端服务（生产环境）
  go-shop-admin-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: go-shop-admin-prod
    ports:
      - "4202:80"
    environment:
      - NODE_ENV=production
      - ANGULAR_ENV=production
    networks:
      - go-shop-network-prod
    restart: unless-stopped

networks:
  go-shop-network-prod:
    driver: bridge 