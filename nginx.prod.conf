events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 生产环境日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log error;

    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 限制请求大小
    client_max_body_size 10M;

    server {
        listen 80;
        server_name admin.go-shop.com localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Angular路由支持
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API代理到生产环境后端
        location /api/ {
            proxy_pass http://go-shop-api-prod:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 生产环境严格跨域控制
            add_header Access-Control-Allow-Origin 'https://admin.go-shop.com';
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
            
            # API限流（可选，需要nginx-plus或第三方模块）
            # limit_req zone=api burst=20 nodelay;
        }

        # 静态资源缓存（长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # 添加ETag
            etag on;
        }

        # 生产环境安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # 隐藏服务器信息
        server_tokens off;
        
        # 生产环境标识
        add_header X-Environment "PRODUCTION" always;
    }
} 